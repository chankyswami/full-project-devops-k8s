namespace:
  name: devops-tools

image:
  name: jenkins/jenkins:lts-jdk21

deployment:
  name: jenkins
  replicas: 1

serviceAccount:
  name: jenkins
  namespace: devops-tools

rbac:
  clusterRole:
    name: jenkins-clusterrole
  clusterRoleBinding:
    name: jenkins-clusterrolebinding

service:
  name: jenkins
  namespace: devops-tools
  type: ClusterIP
  ports:
    http:
      port: 8080
      targetPort: 8080
    jnlp:
      port: 50000
      targetPort: 50000

persistentVolumeClaim:
  enabled: false
  name: jenkins-pv-claim
  namespace: devops-tools
  storage: 5Gi
  storageClassName: local-storage