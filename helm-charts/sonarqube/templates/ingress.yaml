apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarqube-ingress
  namespace: devops-tools
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - sonar-dev.company.com
    secretName: sonar-tls
  rules:
  - host: sonar-dev.company.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sonarqube
            port:
              number: 9000